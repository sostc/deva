config:
  cron_expr: '0 5 * * *'
  execution_mode: scheduler
  run_at: ''
  scheduler_trigger: cron
  task_type: interval
func_code: |
  """
  盘后市场分析 + 每日反思任务

  功能：
  1. 获取主要指数行情（纳指、标普、QQQ、VIX等）
  2. 分析市场状态，存储供LLM反思使用
  3. 触发LLM反思，生成每日反思报告

  执行时间：每天 05:00（美股收盘后，北京时间）

  ❗为什么用 cron 而不是 timer：
    timer 的语义是「启动即执行一次」，服务每重启一次就会重放一次反思
    （2026-10-20 实测重启 25 次 → 钉钉收到 10 条）。cron 只在固定时刻触发，
    重启不会重放；再叠加引擎侧「同一自然日只推一条」的幂等，彻底不会刷屏。
  """
  def execute():
      from deva.naja.cognition.insight.llm_reflection import get_llm_reflection_engine
      engine = get_llm_reflection_engine()
      if not engine:
          return {"success": False, "message": "LLMReflectionEngine 未启动"}

      result = engine.run_daily_reflection()
      if result:
          return {
              "success": True,
              "reflection_theme": result.theme,
              "reflection_summary": result.summary[:200],
          }

      # 「今天已经推送过」是正常跳过，不是失败 —— 别让任务历史里出现假故障
      skip_reason = getattr(engine, "last_skip_reason", "")
      if skip_reason:
          return {"success": True, "skipped": True, "reason": skip_reason}

      return {"success": False, "message": "反思生成失败"}
