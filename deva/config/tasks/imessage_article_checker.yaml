func_code: |
  from datetime import datetime

  def execute():
      """定时任务入口：检查并学习所有渠道的新文章链接。

      ❗这里以前 import 的是 `deva.naja.knowledge.article_link_processor`，
      那个模块早就不存在了（iMessage 通路已合并进 unified_article_monitor）。
      任务于是每 60s 抛一次 ImportError，被调度器记成失败；而"兼容垫片"
      `deva/naja/tasks/imessage_article_checker.py` 本身只是转调
      unified_article_monitor.execute —— 真正的实现一直都在。
      别再写第二份实现，直接委托。
      """
      from deva.naja.tasks.unified_article_monitor import execute as run_once

      result = run_once() or {}
      if not result.get("success"):
          return {
              "success": False,
              "error": result.get("error", "unified_article_monitor 返回失败"),
              "timestamp": datetime.now().isoformat(),
          }
      return {
          "success": True,
          "messages_checked": result.get("messages_checked", 0),
          "articles_handled": result.get("articles_handled", 0),
          "channels": result.get("channels", []),
          "timestamp": datetime.now().isoformat(),
      }
