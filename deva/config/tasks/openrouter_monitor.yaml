func_code: "\"\"\"\nOpenRouter AI 算力 TOKEN 消耗趋势监控\n\n数据源：openrouter.ai/api/frontend/v1/rankings/model-rankings-chart\n\
  粒度由数据自身推断（周桶=7天/日桶=1天），不要在这里假设周期。\n\"\"\"\n\nimport logging\nimport asyncio\nlog\
  \ = logging.getLogger(__name__)\n\n\ndef execute() -> dict:\n    \"\"\"OpenRouter\
  \ AI 算力 TOKEN 消耗趋势监控（每日采集，跟踪当周进度）\"\"\"\n    try:\n        from deva.naja.cognition.openrouter_monitor\
  \ import refresh_openrouter_data\n\n        loop = asyncio.new_event_loop()\n  \
  \      asyncio.set_event_loop(loop)\n        try:\n            result = loop.run_until_complete(refresh_openrouter_data())\n\
  \        finally:\n            loop.close()\n\n        if not result:\n        \
  \    return {\"success\": False, \"message\": \"取数失败或解析 0 条（详见 NB health）\"}\n\n\
  \        return {\n            \"success\": True,\n            \"granularity\":\
  \ result.get(\"granularity\", \"unknown\"),\n            \"period_days\": result.get(\"\
  period_days\", 1),\n            \"latest_date\": result.get(\"latest_date\"),\n\
  \            \"direction\": result.get(\"direction\", \"unknown\"),\n          \
  \  \"momentum_conflict\": result.get(\"momentum_conflict\", \"\"),\n           \
  \ \"latest_change\": result.get(\"latest_change\"),\n            \"is_incomplete_period\"\
  : result.get(\"is_incomplete_period\", False),\n            \"is_stale\": result.get(\"\
  is_stale\", True),\n            \"data_age_days\": result.get(\"data_age_days\"\
  ),\n            \"data_points\": result.get(\"data_points\", 0),\n            \"\
  data_days\": result.get(\"data_days\", 0),\n            \"data_weeks\": result.get(\"\
  data_weeks\", 0),\n            \"message\": result.get(\"message\", \"\"),\n   \
  \     }\n    except Exception as e:\n        log.error(f\"[OpenRouter] 执行失败: {e}\"\
  )\n        return {\"success\": False, \"error\": str(e)}\n"
