metadata:
  name: OpenRouter TOKEN 消耗监控
  description: 监控 OpenRouter 全球 TOKEN 消耗（源为周频周桶，含 Others 残差桶）。注意：分析逻辑已统一到 cognition/openrouter_monitor.py，本条目只做转发，禁止在此重复实现 analyze
  id: openrouter_token_monitor
  category: AI算力
  tags:
    - openrouter
    - ai
    - token
    - 算力
    - 趋势监控
  created_at: 2026-03-28
  updated_at: 2026-03-28

config:
  execution_mode: scheduler
  scheduler_trigger: cron
  cron_expr: "0 9 * * *"
  description: "每日 09:00 执行（数据源为周频，每日采集一次以跟踪当周进度；分析逻辑唯一实现在 cognition/openrouter_monitor.py）"

  data_schema:
    type: ai_metrics
    description: OpenRouter TOKEN 消耗数据
    fields:
      - name: direction
        type: string
        description: 趋势方向
        required: true
      - name: strength
        type: float
        description: 趋势强度
        required: true
      - name: acceleration
        type: float
        description: 趋势加速度
        required: true
      - name: is_anomaly
        type: boolean
        description: 是否异常
        required: true
      - name: anomaly_type
        type: string
        description: 异常类型
        required: false
      - name: message
        type: string
        description: 趋势消息
        required: true
      - name: recommendation
        type: string
        description: 决策建议
        required: true
      - name: alert_level
        type: string
        description: 警报级别
        required: true
      - name: latest_total
        type: int
        description: 最新 TOKEN 总数
        required: true
      - name: latest_total_formatted
        type: string
        description: 格式化后的 TOKEN 总数
        required: true
      - name: latest_date
        type: string
        description: 最新数据日期
        required: true

parameters:
  enabled: true
  timeout: 60

func_code: |
  """
  OpenRouter TOKEN 消耗监控（数据源条目）

  历史遗留：本条目曾自带一份 analyze 实现，与 cognition/openrouter_monitor.py 口径不一致
  （曾在同一份数据上各写一套周期假设），两套实现会互相覆盖 NB 的 openrouter_trend 表。
  现在只做转发，唯一实现是 cognition/openrouter_monitor.refresh_openrouter_data()。
  """

  def fetch_data() -> dict:
      """OpenRouter TOKEN 消耗监控（每日采集，源为周频）

      数据源条目的契约函数名是 fetch_data（tasks 才是 execute），改名会导致
      DataSourceEntry 注册时报「函数 'fetch_data' 未在代码中定义」。
      """
      import asyncio
      import logging
      log = logging.getLogger(__name__)
      try:
          from deva.naja.cognition.openrouter_monitor import refresh_openrouter_data

          loop = asyncio.new_event_loop()
          asyncio.set_event_loop(loop)
          try:
              result = loop.run_until_complete(refresh_openrouter_data())
          finally:
              loop.close()

          if not result:
              return {"success": False, "message": "取数失败或解析 0 条（详见 NB health）"}

          return {
              "success": True,
              "direction": result.get("direction", "unknown"),
              "rolling_7d": result.get("rolling_7d"),
              "latest_change": result.get("latest_change"),
              "is_stale": result.get("is_stale", True),
              "data_days": result.get("data_days", 0),
              "message": result.get("message", ""),
          }
      except Exception as e:
          log.error(f"[OpenRouter] 执行失败: {e}")
          return {"success": False, "error": str(e)}
