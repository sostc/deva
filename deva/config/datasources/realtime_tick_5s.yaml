  现在只做转发，唯一实现是 deva.naja.datasource.realtime_tick：
  并发抓取 + 有效宇宙自收敛（全量扫一次收敛到约 5 千个真实代码）+ 三态语义。
  """


  def fetch_data():
      """转发到仓库实现

      返回三态之一（语义见 deva.naja.datasource.realtime_tick）：
        · list[dict]                      成功，每只票一行
        · {"skipped": 原因, ...}          按设计不取数（非交易时段）
        · {"success": False, "error": ..} 抓取失败（绝不用 None / [] 冒充）
      """
      from deva.naja.datasource.realtime_tick import fetch_data as _impl

      return _impl()
